<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for the env(safe-area-inset-*) CSS
         variables (see index.css) to report real, non-zero values at all —
         without it, Android 15+ edge-to-edge (targetSdk 36 draws behind the
         status/nav bars by default now) would let content sit underneath
         the system bars with nothing pushing it clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0B3D91" />
    <script>/* Animations play by default, even if the phone says "Remove animations"; a phone can opt out in /motion-check.html (sarthi_forceMotion = '0'). */try{if(localStorage.getItem('sarthi_forceMotion')!=='0')document.documentElement.classList.add('force-motion')}catch(e){document.documentElement.classList.add('force-motion')}</script>
    <!-- The app already switches between English/Hindi itself via its own
         ENG/हिं toggle — browser auto-translate (e.g. Chrome Translate)
         conflicts with that and mistranslates "Apna" (not a real English
         word it recognizes) into "Your"/"Own". Disable it entirely. -->
    <meta name="google" content="notranslate" />
    <title>अपना ट्रांसपोर्ट | Apna Transport</title>

    <link rel="preload" as="image" href="/icons/icon-512.png" />
    <!-- Inter (English/digits) + Noto Sans Devanagari (Hindi/Marathi) for the
         2026-10-26 look refresh; display=swap so text never waits on them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..900;1,400..900&family=Noto+Sans+Devanagari:wght@400..800&display=swap" rel="stylesheet" />
    <style>
      /* App loading screen -- shown until the React app mounts into #root. Inlined
         so it paints on the first frame with no extra request; the inline script
         at the end of the body removes it once #root has content (or after a hard
         timeout). Redesigned 2026-10-29 (owner: "improve the entry and refresh
         animation"): the app icon rises into place on a deep-blue field with a
         one-time shine and a slim yellow progress bar, then the screen eases away
         into the app. A Refresh-button reload (flagged in sessionStorage by the
         button) plays a much shorter variant (.is-refresh): no entrance, just the
         icon with a spinning ring, so a refresh feels like a refresh, not a
         restart. Background matches theme-color so there is no colour jump. */
      #app-loader{position:fixed;inset:0;z-index:2147483647;display:flex;
        align-items:center;justify-content:center;overflow:hidden;
        background:radial-gradient(120% 90% at 50% 38%,#13499f 0%,#0B3D91 55%,#082c6b 100%);
        transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1)}
      #app-loader.is-hidden{opacity:0;transform:scale(1.04);pointer-events:none}
      #app-loader .al-glow{position:absolute;left:50%;top:44%;width:360px;height:360px;
        margin:-180px 0 0 -180px;border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(120,175,255,.34) 0%,rgba(120,175,255,0) 68%);
        animation:al-glow 2.4s ease-in-out infinite}
      #app-loader .al-stage{position:relative;display:flex;flex-direction:column;
        align-items:center;gap:30px}
      #app-loader .al-tile-wrap{position:relative;width:min(34vw,148px);aspect-ratio:1}
      #app-loader .al-tile{position:relative;width:100%;height:100%;border-radius:26%;
        overflow:hidden;background:#FFCC00;
        box-shadow:0 18px 44px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.14);
        animation:al-rise 1s cubic-bezier(.22,.9,.3,1) both,
                  al-breathe 3.6s ease-in-out 1.1s infinite}
      #app-loader .al-icon{display:block;width:100%;height:100%;object-fit:cover}
      #app-loader .al-shine{position:absolute;inset:-20% auto -20% -60%;width:45%;
        background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
        transform:skewX(-18deg);animation:al-shine 1.3s cubic-bezier(.4,0,.2,1) .8s both}
      #app-loader .al-ring{position:absolute;inset:-12px;border-radius:32%;display:none;
        border:3px solid rgba(255,255,255,.16);border-top-color:#FFCC00;
        animation:al-spin 1s linear infinite}
      #app-loader .al-bar{position:relative;width:104px;height:3px;border-radius:3px;
        background:rgba(255,255,255,.18);overflow:hidden;animation:al-fade .6s ease .5s both}
      #app-loader .al-bar i{position:absolute;top:0;bottom:0;left:0;width:100%;border-radius:3px;
        background:#FFCC00;transform-origin:left center;transform:scaleX(0);
        animation:al-fill 2.2s cubic-bezier(.45,.05,.25,1) .5s forwards}
      /* Refresh-button reload: quick and calm. */
      #app-loader.is-refresh{transition:opacity .45s ease,transform .45s ease}
      #app-loader.is-refresh .al-glow{animation:none;opacity:.7}
      #app-loader.is-refresh .al-tile{width:100%;animation:none}
      #app-loader.is-refresh .al-tile-wrap{width:min(24vw,104px)}
      #app-loader.is-refresh .al-shine,#app-loader.is-refresh .al-bar{display:none}
      #app-loader.is-refresh .al-ring{display:block}
      @keyframes al-rise{0%{opacity:0;transform:translateY(16px) scale(.9)}
        100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes al-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
      @keyframes al-shine{0%{left:-60%;opacity:0}15%{opacity:1}100%{left:130%;opacity:0}}
      @keyframes al-fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @keyframes al-glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
      @keyframes al-spin{to{transform:rotate(360deg)}}
      @keyframes al-fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        html:not(.force-motion) #app-loader,html:not(.force-motion) #app-loader.is-hidden{transform:none}
        html:not(.force-motion) #app-loader .al-tile{animation:al-fade .4s ease both}
        html:not(.force-motion) #app-loader .al-glow,html:not(.force-motion) #app-loader .al-shine{animation:none}
        html:not(.force-motion) #app-loader .al-bar i{animation:none;transform:scaleX(1)}
        html:not(.force-motion) #app-loader .al-ring{animation:none}
      }
    </style>
  </head>
  <body translate="no">
    <div id="root"></div>
    <div id="app-loader" role="progressbar" aria-label="Loading Apna Transport" aria-live="polite">
      <div class="al-glow"></div>
      <div class="al-stage">
        <div class="al-tile-wrap">
          <span class="al-ring"></span>
          <div class="al-tile">
            <img class="al-icon" src="/icons/icon-512.png" alt="" width="512" height="512" draggable="false" />
            <span class="al-shine"></span>
          </div>
        </div>
        <div class="al-bar"><i></i></div>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (!root || !loader) return;
        // The Refresh button flags the reload in sessionStorage (see
        // useRefreshButton in App.jsx) so it gets the short variant.
        var isRefresh = false;
        try { isRefresh = sessionStorage.getItem('sarthi_refresh') === '1'; sessionStorage.removeItem('sarthi_refresh'); } catch (e) {}
        if (isRefresh) loader.classList.add('is-refresh');
        var start = Date.now(), MIN_SHOW = isRefresh ? 900 : 2400, HARD_CAP = 10000, done = false;
        function dismiss() {
          if (done) return;
          done = true;
          var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
          setTimeout(function () {
            loader.classList.add('is-hidden');
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, isRefresh ? 500 : 850);
          }, wait);
        }
        if (root.childElementCount > 0) { dismiss(); return; }
        var obs = new MutationObserver(function () {
          if (root.childElementCount > 0) { obs.disconnect(); dismiss(); }
        });
        obs.observe(root, { childList: true });
        setTimeout(dismiss, HARD_CAP);
      })();
    </script>
    <script>
      /* Owner 2026-10-31 ("clean frontend"): on a flaky network the page script can arrive while the stylesheet fails, which
         leaves the whole app unstyled (plain grey buttons, huge text). index.css sets --sarthi-css:1 on :root; if it is
         missing once the page has loaded, reload ONE time (sessionStorage guard, so it can never loop). */
      (function () {
        try {
          window.addEventListener('load', function () {
            setTimeout(function () {
              var ok = getComputedStyle(document.documentElement).getPropertyValue('--sarthi-css').trim() === '1';
              if (!ok && sessionStorage.getItem('sarthi_css_retry') !== '1') {
                sessionStorage.setItem('sarthi_css_retry', '1');
                location.reload();
              }
            }, 1500);
          });
        } catch (e) { /* storage blocked: do nothing */ }
      })();
    </script>
    <script>
      /* White-screen watchdog (2026-11-02, "blank white screen on the Admin app"): the loader above gives up after 10 s, so if the
         app's JavaScript never starts (a file failed to load, an old WebView cannot parse it, a bad cache) the user is left with a
         BLANK page and nobody can tell why. If React has not put anything into #root after 12 s this shows what went wrong (the
         first script errors caught while loading) plus a Reload button that also clears the caches and the service worker. It
         removes itself again if the app turns out to be merely slow and mounts later. Never runs once the app has started. */
      (function () {
        var errs = [];
        function rec(m) { if (errs.length < 6) errs.push(String(m).slice(0, 240)); }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t !== window && (t.src || t.href)) rec('failed to load: ' + String(t.src || t.href).replace(location.origin, ''));
          else rec((e && e.message || 'error') + ' @' + String(e && e.filename || '').split('/').pop() + ':' + (e && e.lineno || ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { rec('promise: ' + (e && e.reason && (e.reason.message || e.reason))); });
        function mounted() { var r = document.getElementById('root'); return !!(r && r.childElementCount > 0); }
        function recover() {
          try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
          var done = function () { location.reload(); };
          try { if (window.caches) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(done, done); else done(); } catch (e) { done(); }
          setTimeout(done, 2500);
        }
        setTimeout(function () {
          if (mounted()) return;
          var box = document.createElement('div');
          box.id = 'boot-watchdog';
          box.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:#fff;color:#0F1B2D;font-family:system-ui,sans-serif;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto';
          var h = document.createElement('p'); h.style.cssText = 'font-size:16px;font-weight:700;margin:0 0 6px'; h.textContent = '\u0910\u092a \u0936\u0941\u0930\u0942 \u0928\u0939\u0940\u0902 \u0939\u094b \u0938\u0915\u093e / The app did not start';
          var m = document.createElement('p'); m.style.cssText = 'font-size:13px;color:#475569;margin:0 0 16px'; m.textContent = '\u0915\u0943\u092a\u092f\u093e \u0928\u0940\u091a\u0947 \u0930\u0940\u0932\u094b\u0921 \u0926\u092c\u093e\u090f\u0902 / Please tap Reload';
          var b = document.createElement('button'); b.textContent = 'Reload'; b.style.cssText = 'background:#0052CC;color:#fff;border:0;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:700;margin-bottom:18px'; b.onclick = recover;
          var d = document.createElement('pre'); d.style.cssText = 'font-size:10px;text-align:left;white-space:pre-wrap;word-break:break-word;background:#F1F4F9;border:1px solid #D5DCE8;border-radius:10px;padding:10px;max-width:100%;margin:0'; d.textContent = 'Details for support:\n' + (errs.length ? errs.join('\n') : 'no script error was caught (network or cache problem?)') + '\n' + navigator.userAgent;
          box.appendChild(h); box.appendChild(m); box.appendChild(b); box.appendChild(d); document.body.appendChild(box);
          var iv = setInterval(function () { if (mounted()) { clearInterval(iv); if (box.parentNode) box.parentNode.removeChild(box); } }, 1000);
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0B3D91" />
    <!-- The app already switches between English/Hindi itself via its own
         ENG/हिं toggle — browser auto-translate (e.g. Chrome Translate)
         conflicts with that and mistranslates "Apna" (not a real English
         word it recognizes) into "Your"/"Own". Disable it entirely. -->
    <meta name="google" content="notranslate" />
    <title>अपना ट्रांसपोर्ट | Apna Transport</title>

    <link rel="preload" as="image" href="/icons/icon-512.png" />
    <style>
      /* App loading screen — "drive-in" branded loader shown until the React
         app mounts into #root. Inlined so it paints on the first frame with
         no extra request; the inline script at the end of the body removes
         it once #root has content (or after a hard timeout). Background
         matches theme-color / the TWA splash so there's no colour jump on
         handoff. */
      #app-loader{position:fixed;inset:0;z-index:2147483647;display:flex;
        align-items:center;justify-content:center;background:#0B3D91;
        overflow:hidden;transition:opacity .45s ease}
      #app-loader.is-hidden{opacity:0;pointer-events:none}
      #app-loader .al-stage{position:relative;width:min(72vw,280px);
        height:min(72vw,280px);display:flex;align-items:flex-end;
        justify-content:center}
      #app-loader .al-truck-wrap{position:relative;display:block;width:64%;
        margin-bottom:14%;will-change:transform;
        animation:al-drivein 1s cubic-bezier(.2,1.15,.35,1) both}
      #app-loader .al-truck{display:block;width:100%;height:auto;
        filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));will-change:transform;
        animation:al-bob 1.8s ease-in-out 1.15s infinite}
      #app-loader .al-road{position:absolute;left:8%;right:8%;bottom:12%;
        height:2px;border-radius:2px;background:rgba(255,255,255,.28);
        transform-origin:left center;animation:al-road .85s ease-out both}
      #app-loader .al-line{position:absolute;left:-30px;height:2px;
        border-radius:2px;background:rgba(255,255,255,.55)}
      #app-loader .al-line.l1{width:22px;bottom:13%;animation:al-streak .7s ease-in .15s infinite}
      #app-loader .al-line.l2{width:14px;bottom:21%;animation:al-streak .7s ease-in .32s infinite}
      #app-loader .al-line.l3{width:18px;bottom:8%;animation:al-streak .7s ease-in .02s infinite}
      #app-loader .al-dots{position:absolute;bottom:-9%;left:50%;
        transform:translateX(-50%);display:flex;gap:7px}
      #app-loader .al-dots i{width:7px;height:7px;border-radius:50%;
        background:rgba(255,255,255,.7);animation:al-pulse 1.1s ease-in-out infinite}
      #app-loader .al-dots i:nth-child(2){animation-delay:.16s}
      #app-loader .al-dots i:nth-child(3){animation-delay:.32s}
      @keyframes al-drivein{0%{transform:translateX(-165%)}
        68%{transform:translateX(5%)}84%{transform:translateX(-2%)}
        100%{transform:translateX(0)}}
      @keyframes al-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
      @keyframes al-road{0%{transform:scaleX(0);opacity:0}
        30%{opacity:1}100%{transform:scaleX(1);opacity:1}}
      @keyframes al-streak{0%{transform:translateX(0);opacity:0}
        20%{opacity:1}100%{transform:translateX(260px);opacity:0}}
      @keyframes al-pulse{0%,100%{opacity:.3;transform:scale(.8)}
        50%{opacity:1;transform:scale(1)}}
      @keyframes al-fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        #app-loader .al-truck-wrap{animation:al-fade .4s ease both}
        #app-loader .al-truck,#app-loader .al-dots i{animation:none}
        #app-loader .al-road{animation:none;transform:scaleX(1);opacity:1}
        #app-loader .al-line{display:none}
      }
    </style>
  </head>
  <body translate="no">
    <div id="root"></div>
    <div id="app-loader" role="progressbar" aria-label="Loading Apna Transport" aria-live="polite">
      <div class="al-stage">
        <span class="al-line l1"></span>
        <span class="al-line l2"></span>
        <span class="al-line l3"></span>
        <span class="al-truck-wrap">
          <img class="al-truck" src="/icons/icon-512.png" alt="" width="512" height="512" draggable="false" />
        </span>
        <span class="al-road"></span>
        <span class="al-dots"><i></i><i></i><i></i></span>
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (!root || !loader) return;
        var start = Date.now(), MIN_SHOW = 1200, HARD_CAP = 10000, done = false;
        function dismiss() {
          if (done) return;
          done = true;
          var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
          setTimeout(function () {
            loader.classList.add('is-hidden');
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 550);
          }, wait);
        }
        if (root.childElementCount > 0) { dismiss(); return; }
        var obs = new MutationObserver(function () {
          if (root.childElementCount > 0) { obs.disconnect(); dismiss(); }
        });
        obs.observe(root, { childList: true });
        setTimeout(dismiss, HARD_CAP);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

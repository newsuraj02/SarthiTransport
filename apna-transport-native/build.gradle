// Top-level build file -- plugin versions declared here (not applied), each
// module applies what it needs. Keeps AGP/Kotlin/Compose-compiler/Google
// Services versions in exactly one place instead of scattered per-module.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.2' apply false
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

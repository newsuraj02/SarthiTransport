plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // Applied conditionally at the bottom of this file -- see the
    // google-services.json existence check, same reasoning as the
    // Capacitor app's android/app/build.gradle: a local/dev checkout
    // without that file (not yet downloaded from Firebase Console) should
    // still build, just without Firebase wired up, rather than failing
    // the whole Gradle sync outright.
}

// local.properties is gitignored (see .gitignore) -- the usual place to
// drop a MAPS_API_KEY for a local dev build without committing it.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace = "com.apnatransport.mobile"
    compileSdk = 36

    defaultConfig {
        // Deliberately NOT com.apnatransport.app, that's the live
        // Capacitor app's real applicationId, already on every customer's
        // and driver's phone via Play Store. This native rewrite (both
        // roles, Customer and Driver, in one app; Admin stays on the
        // hybrid app indefinitely) ships under its own id for
        // sideload-only testing until it's proven solid enough to be
        // considered for a real cutover, at which point this becomes its
        // own decision, not an accident of reusing an id that's already
        // live.
        applicationId = "com.apnatransport.mobile"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Native Android Maps SDK key -- a DIFFERENT key from the JS Maps
        // API key the main Capacitor app's WebView uses (src/App.jsx),
        // since this is the native com.google.android.gms:play-services-maps
        // SDK, not a loaded JS script. Create one in Google Cloud Console
        // restricted to this app's applicationId + release SHA-1, then
        // either set MAPS_API_KEY in local.properties (gitignored) or pass
        // -PmapsApiKey=... on the command line. Builds fine without one;
        // map screens just won't render tiles until it's set.
        def mapsApiKey = project.hasProperty("mapsApiKey") ? project.mapsApiKey : (localProps.getProperty("MAPS_API_KEY") ?: "")
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey
    }

    signingConfigs {
        // No release signing wired up yet -- this is sideload-only at
        // this stage (see Phase 1 plan: separate test applicationId,
        // not distributed via Play Console). Add a release signingConfig
        // here (mirroring android/app/build.gradle's env-var-driven one)
        // once this is far enough along to need a signed build for wider
        // testing.
        debug {}
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // -- Core / Compose --
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.core:core-splashscreen:1.2.0"
    // AppCompatActivity -- used by RingingBookingActivity (ported as a
    // plain View/XML Activity, not Compose, same as the original it's
    // ported from) rather than every screen in the app.
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.navigation:navigation-compose:2.8.3"

    // -- Coroutines (bridges Play Services Task<T> / Firestore listeners
    // into suspend functions and Flows, instead of nested callback
    // listeners throughout the UI layer) --
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0"

    // -- Firebase -- same BOM version as android/app/build.gradle (the
    // Capacitor app) for consistency, not that it strictly needs to match
    // since this is a separate app talking to the same backend.
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-messaging"
    // Automatic crash reporting -- this sandbox has no Android device/
    // emulator/adb to get a real stack trace from a device-only crash, so
    // this is how those actually get diagnosed from here on: a crash on a
    // sideloaded build uploads to the sarthi-transport-74865 Firebase
    // project's Crashlytics dashboard (Firebase Console -> Crashlytics),
    // where the real stack trace can be read directly instead of guessing
    // from symptom descriptions.
    implementation "com.google.firebase:firebase-crashlytics"

    // -- Location (LocationTrackerService) + Maps (trip/pickup screens) --
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-maps:19.0.0"
    implementation "com.google.maps.android:maps-compose:6.4.1"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.10.01")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}

// Same pattern as android/app/build.gradle: apply google-services only if
// the config file is actually present, so a fresh checkout without it yet
// downloaded from Firebase Console still builds (just without Firebase
// wired up) instead of failing Gradle sync outright. See this project's
// README for how to register this app (package com.apnatransport.mobile)
// under the same Firebase project (sarthi-transport-74865) and download
// its google-services.json into this directory.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics' Gradle plugin needs google-services.json present
        // too (reads the same app id out of it), so gated on the same
        // check rather than a separate one.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch (Exception e) {
    logger.warn("google-services.json not found in apna-transport-native/app/ -- Firebase won't initialize until it's added. See apna-transport-native/README.md.")
}

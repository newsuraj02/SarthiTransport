name: Build Play Store package (Capacitor)

# Manually-triggered only. Builds and signs both the .aab (for Play
# Console) and a sideload-testable .apk from the Capacitor-based Android
# wrapper (android/ — committed directly, unlike twa/project, since
# Capacitor's project needs hand-edited native files such as
# android/app/src/main/java/com/apnatransport/app/SettingsBridgeActivity.java
# to persist between builds). See capacitor.config.ts: the shipped app
# loads the live site at server.url, not the dist/ build produced below —
# that build only exists so `cap sync` has something to (harmlessly) copy
# into the native project's assets folder.
#
# This is the Capacitor migration's counterpart to
# .github/workflows/build-twa.yml, which stays in place untouched as a
# fallback until this is confirmed working on a real device — same
# applicationId (com.apnatransport.app) and the same signing secrets, so
# either workflow produces a build that installs as a normal update over
# the other.
on:
  workflow_dispatch:
    inputs:
      app_version_code:
        description: "New versionCode. Must be higher than the current one in Play Console (Release > App bundle explorer)."
        required: true
      app_version_name:
        description: "Version name shown to users (e.g. 1.2.0). Defaults to the version code if left blank."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's own core module (node_modules/@capacitor/android/
          # capacitor/build.gradle) sets sourceCompatibility/
          # targetCompatibility to JavaVersion.VERSION_21, unlike the TWA
          # workflow's Bubblewrap/androidbrowserhelper build, which is
          # fine on 17 — this one genuinely needs a JDK that can target 21.
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.5.1 hard-requires Node >=22 at runtime (`npx cap
          # sync` fails fast with "[fatal] The Capacitor CLI requires NodeJS
          # >=22.0.0") even though `npm install` itself only warns about it —
          # this was still on 20 from before that requirement landed.
          node-version: "22"

      - name: Install dependencies (web app + @capacitor/cli, @capacitor/android)
        run: npm install

      - name: Build the web app
        # Only needed so `cap sync` below has a dist/ to copy into the
        # native project's assets folder — capacitor.config.ts's
        # server.url always wins over it at runtime, so nothing built
        # here actually ships to users. Firebase env vars are
        # deliberately not supplied (no VITE_FIREBASE_* secrets read
        # here) since none of this build output is ever served.
        run: npm run build

      - name: Sync web build + native plugins into the Android project
        run: npx cap sync android

      - name: Decode signing keystore
        # Same tolerant decode as build-twa.yml — see that file's comment
        # for why (Windows' certutil-encoded secrets aren't plain base64).
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | grep -v '^-----' \
            | tr -d ' \t\r\n' \
            | base64 -d -i > "$GITHUB_WORKSPACE/android/release.keystore"
          test -s "$GITHUB_WORKSPACE/android/release.keystore" || { echo "::error::Decoded keystore is empty — ANDROID_KEYSTORE_BASE64 secret is not valid base64 of a keystore file."; exit 1; }

      - name: Verify keystore + alias + password (fails fast with a clear error instead of deep into the build)
        env:
          JKS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JKS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          "$JAVA_HOME/bin/keytool" -list -keystore "$GITHUB_WORKSPACE/android/release.keystore" \
            -alias "$JKS_ALIAS" -storepass "$JKS_PASS" > /dev/null

      - name: Build + sign .apk and .aab
        # ANDROID_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD are read
        # directly by android/app/build.gradle's signingConfigs.release
        # block. appVersionCode/appVersionName are read by that same
        # file's defaultConfig block via project property lookups.
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PappVersionCode="${{ inputs.app_version_code }}" \
            -PappVersionName="${{ inputs.app_version_name || inputs.app_version_code }}"

      - uses: actions/upload-artifact@v4
        with:
          name: apna-transport-capacitor-release-${{ inputs.app_version_code }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

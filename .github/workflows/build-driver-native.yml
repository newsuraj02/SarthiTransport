name: Build Driver app (native, Phase 1 scaffold)

# Manually-triggered only. Builds a debug .apk of the fully-native driver
# app scaffold (driver-native/ -- see that directory's README). This is
# the native rewrite started per explicit request to make GPS/notification
# reliability independent of the hybrid Capacitor app's remote-URL-mode
# risks; it ships under its own applicationId (com.apnatransport.driver),
# completely separate from the live com.apnatransport.app, and is
# sideload-only at this stage -- not connected to Play Console, no release
# signing configured yet.
#
# No google-services.json is committed yet (needs registering
# com.apnatransport.driver as a new Android app under the sarthi-transport-74865
# Firebase project first -- see driver-native/README.md), so this currently
# builds WITHOUT Firebase wired up (app/build.gradle's google-services
# plugin application is conditional on that file's presence, same pattern
# as android/app/build.gradle). Once that file is added and committed,
# this build picks it up automatically, no workflow change needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Build debug APK
        working-directory: driver-native
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apna-driver-native-debug
          path: driver-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

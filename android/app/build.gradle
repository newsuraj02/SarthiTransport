apply plugin: 'com.android.application'

// Release signing — sourced from environment variables so CI (see
// .github/workflows/build-capacitor.yml) can supply them straight from the
// same ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/
// ANDROID_KEY_PASSWORD GitHub Actions secrets already used to sign the TWA
// build (see .github/workflows/build-twa.yml) — same keystore, same
// applicationId below, so this ships as a normal update to the existing
// Play Store listing rather than a new one. ANDROID_KEYSTORE_PATH points at
// wherever CI decoded the keystore file to. Left unset, a local/dev build
// just produces an unsigned release artifact instead of failing outright.
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace = "com.apnatransport.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.apnatransport.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridden from CI via -PappVersionCode/-PappVersionName (see
        // build-capacitor.yml) — these two defaults only matter for a
        // local/dev build run without those properties.
        versionCode (project.hasProperty("appVersionCode") ? (project.appVersionCode as Integer) : 1)
        versionName (project.hasProperty("appVersionName") ? project.appVersionName : "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Packages a native-debug-symbols.zip into the .aab so Play
            // Console can symbolicate crashes/ANRs in the small amount of
            // native (.so) code bundled by AndroidX/Capacitor dependencies
            // (Play Console flagged this as missing on versionCode 12's
            // upload) — pure metadata for crash reporting, doesn't change
            // anything about how the app runs.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Drives the real native "Turn on Location?" system dialog (see
    // LocationBridgePlugin) -- the same one Google Maps/Uber show, not a
    // custom in-app banner. Device-wide Location Services being off is
    // outside what navigator.geolocation (or any web JS) can fix on its
    // own; this is Google Play Services' own settings-resolution API.
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // Drives Play Core's own in-app "immediate update" screen (see
    // AppUpdateBridgePlugin) instead of only linking out to Play Store.
    implementation "com.google.android.play:app-update:2.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

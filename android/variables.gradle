ext {
    // Matches the previous (TWA) release's floor — see the "TWA: raise
    // minSdkVersion to 23" commit, chosen there because androidbrowserhelper
    // required it, not because anything needs exactly 23. Capacitor's
    // template default of 24 dropped ~1,008 previously-supported devices
    // (Play Console flagged this on versionCode 12's upload) for no reason
    // specific to this app — every Capacitor plugin here reads this same
    // value rather than hardcoding its own floor, so lowering it here is
    // enough.
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}